<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WSM Athenas</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/JW6tx1k6/Chat-GPT-Image-21-de-jun-de-2026-17-21-07-removebg-preview.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Kalam:wght@300;400;700&family=Inter:wght@300;400;500;600;700;800;900&family=Mr+De+Haviland&family=Monsieur+La+Doulaise&display=swap" rel="stylesheet" />
    <script>
      window.MathJax = {
        loader: { load: ['[tex]/textmacros', '[tex]/mhchem'] },
        tex: {
          packages: {'[+]': ['textmacros', 'mhchem', 'ams']},
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true,
          processEnvironments: true
        },
        options: {
          enableAssistiveMml: false,
          menuOptions: {
            settings: {
              assistiveMml: false
            }
          },
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'annotation', 'annotation-xml', 'mjx-container', 'mjx-assistive-mml'],
          ignoreHtmlClass: 'tex2jax_ignore|mjx-assistive-mml|MathJax_Ignore'
        },
        chtml: {
          displayAlign: 'center'
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
