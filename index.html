<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WSM Athenas</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dqx8p8orf/image/upload/f_auto/q_auto/gallery_image_20260927_114822-sem-mexer-em-mais-nada-nesse-boneco-mantenha-a-con-removebg-preview_3_ewaz6x.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
    <script>
      window.MathJax = {
        loader: { load: ['[tex]/textmacros', '[tex]/mhchem'] },
        tex: {
          packages: {'[+]': ['textmacros', 'mhchem', 'ams']},
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true,
          processEnvironments: true
        },
        options: {
          enableAssistiveMml: false,
          menuOptions: {
            settings: {
              assistiveMml: false
            }
          },
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'annotation', 'annotation-xml', 'mjx-container', 'mjx-assistive-mml'],
          ignoreHtmlClass: 'tex2jax_ignore|mjx-assistive-mml|MathJax_Ignore'
        },
        chtml: {
          displayAlign: 'center'
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <!-- VLibras: Acessibilidade em Libras para todo o site -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      (function() {
        var attempts = 0;
        function initVLibras() {
          if (window.VLibras && typeof window.VLibras.Widget === 'function') {
            try {
              new window.VLibras.Widget('https://vlibras.gov.br/app');
            } catch (err) {
              console.warn('VLibras init error:', err);
            }
          } else if (attempts < 50) {
            attempts++;
            setTimeout(initVLibras, 200);
          }
        }
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
          initVLibras();
        } else {
          window.addEventListener('load', initVLibras);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
